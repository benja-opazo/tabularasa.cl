# Cloudflare Workers static-assets config - same shape as benjaopazoc.cl's
# wrangler.toml (see docs/decisions/deploy.md for why this pattern over
# classic Cloudflare Pages). `[assets] directory` points at the hand-authored
# deploy root - there is no build step, so `site/` IS the deployed output, not
# a generated artifact.
#
# `main` + the `routes` below exist for the /latest/<platform> redirect
# landing page on downloads.tabularasa.cl (see
# docs/decisions/download-redirect.md), which reuses the real site's CSS/JS
# (hence the second route, for /assets/*). worker/index.js handles both
# routes and falls through to env.ASSETS.fetch() otherwise - on
# tabularasa.cl itself (a full Custom Domain, not a path-scoped Route) that
# covers every request, so the static site behaves exactly as before.
name = "tabularasa-cl"
compatibility_date = "2026-08-05"
workers_dev = true
preview_urls = true
main = "worker/index.js"

[assets]
directory = "./site"
binding = "ASSETS"

# downloads.tabularasa.cl already has an R2 Custom Domain serving /releases/*
# (owned by the tabula-rasa repo's release pipeline) - Worker Routes on more
# specific path patterns take precedence over that without needing to move
# /releases/* off R2. Assumes downloads.tabularasa.cl lives in the same
# "tabularasa.cl" zone - not yet verified (see the decision doc).
#
# Routes are matched by path pattern, not "this Worker now owns the
# hostname" - /assets/* needs its own entry so the /latest/<platform> landing
# page's CSS/JS/font requests actually reach this Worker (and fall through to
# env.ASSETS.fetch()) instead of hitting the R2 custom domain and 404ing.
routes = [
  { pattern = "downloads.tabularasa.cl/latest/*", zone_name = "tabularasa.cl" },
  { pattern = "downloads.tabularasa.cl/assets/*", zone_name = "tabularasa.cl" },
  { pattern = "downloads.tabularasa.cl/robots.txt", zone_name = "tabularasa.cl" },
]
